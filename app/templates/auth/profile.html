{% extends "base.html" %}

{% block title %}My Profile{% endblock %}
{% block page_title %}User Profile &amp; Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white border-bottom py-3">
                <h5 class="card-title mb-0 fw-bold"><i class="bi bi-person-gear me-2 text-primary"></i>Profile Details</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.profile') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Username</label>
                            <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
                            <small class="text-muted">Username cannot be changed</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Assigned Role</label>
                            <input type="text" class="form-control" value="{{ current_user.role }}" disabled>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Full Name</label>
                            <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Phone Number</label>
                            <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-semibold text-secondary">Email Address</label>
                            <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
                        </div>

                        <hr class="my-3 text-secondary">

                        <div class="col-12">
                            <h6 class="fw-bold mb-2">Change Password</h6>
                            <p class="text-muted small">Leave blank to keep your current password.</p>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">New Password</label>
                            <input type="password" name="new_password" class="form-control" placeholder="Min 6 characters">
                        </div>
                    </div>

                    <div class="mt-4 pt-2 text-end">
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-check-lg me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
